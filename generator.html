<!DOCTYPE html>

          <circle cx="12" cy="12" r="8"/>

    <div class="mobile-topbar"><span>FARSIDE</span></div>
    <div class="nav-overlay" id="nav-overlay" aria-hidden="true"></div>

                <span class="nav-text">Генератор</span>
                <span class="nav-count">02</span>
              </a>

            <li>
              <a href="about.html">
                <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></span>
                <span class="nav-text">Манифест</span>
                <span class="nav-count">03</span>
              </a>
            </li>

      <h1 class="headline hero-enter hero-enter-1">
        Найди свой<br />
        <em>новый жанр</em>
      </h1>
    </div>

    <div class="gen-layout hero-enter hero-enter-2">
      <div class="gen-top">
        <button class="btn btn-primary" id="generate-btn" type="button">
          Запустить генератор
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
        <p class="gen-genre" id="genre-out">Жанр появится здесь</p>
      </div>

      <div class="gen-row">
        <div class="gen-left" id="gen-left">
          <p class="gen-left-placeholder">Обложка плейлиста появится здесь</p>
        </div>
        <div class="gen-right" id="gen-right">
          <div class="gen-playlist" data-slot="0"></div>
          <div class="gen-playlist" data-slot="1"></div>
          <div class="gen-playlist" data-slot="2"></div>
          <div class="gen-playlist" data-slot="3"></div>
          <div class="gen-playlist" data-slot="4"></div>
          <div class="gen-playlist" data-slot="5"></div>
        </div>
      </div>
