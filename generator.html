<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Генератор — FARSIDE</title>
  <meta name="description" content="Генератор жанров Spotify." />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    (function () {
      var t = localStorage.getItem("farside-theme") || "dark";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <div class="video-backdrop" aria-hidden="true">
    <video id="bg-video" autoplay muted loop playsinline preload="auto" poster="media/horizon-poster.jpg">
      <source src="media/mainfon.mp4" type="video/mp4" />
    </video>
    <div class="video-vignette"></div>
    <div class="video-scrim"></div>
    <button type="button" id="bg-pause" aria-label="Остановить фоновое видео"></button>
  </div>

  <div class="nav-shell">
    <a class="skip-link" href="#content">К содержанию</a>
    <header class="topbar">
      <a class="topbar-brand" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="8"/><ellipse cx="12" cy="12" rx="3.5" ry="8"/><path d="M4 12h16"/></svg>
        FARSIDE
      </a>
      <nav class="topbar-links" aria-label="Основная навигация">
        <a href="index.html">Главная</a>
        <a href="generator.html">Генератор</a>
        <a href="about.html">Манифест</a>
        <a href="settings.html">Настройки</a>
      </nav>
      <button type="button" class="burger-btn" id="burger" aria-expanded="false" aria-controls="nav-panel" aria-label="Открыть меню">
        <span class="burger-icon" id="burger-icon"><span></span><span></span></span>
      </button>
    </header>
    <div class="nav-overlay" id="nav-overlay" aria-hidden="true"></div>
    <aside class="nav-panel" id="nav-panel" role="dialog" aria-modal="true" aria-label="Навигация">
      <div class="nav-panel-head">
        <div class="nav-panel-title">Меню</div>
        <button type="button" class="nav-close" id="nav-close" aria-label="Закрыть">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="nav-scroll">
        <ul class="nav-items">
          <li><a href="index.html"><span class="nav-text">Главная</span><span class="nav-count">01</span></a></li>
          <li><a href="generator.html"><span class="nav-text">Генератор</span><span class="nav-count">02</span></a></li>
          <li><a href="about.html"><span class="nav-text">Манифест</span><span class="nav-count">03</span></a></li>
          <li><a href="settings.html"><span class="nav-text">Настройки</span><span class="nav-count">04</span></a></li>
        </ul>
      </div>
      <p class="nav-footer">Случайный жанр за горизонтом привычного звука.</p>
    </aside>
  </div>

  <main class="stage" id="content">
    <div class="stage-inner narrow">
      <p class="kicker hero-enter">Генератор</p>
      <h1 class="headline hero-enter hero-enter-1">Найди свой<br /><em>новый жанр</em></h1>
    </div>
    <div class="gen-layout hero-enter hero-enter-2">
      <div class="gen-top">
        <button class="btn btn-primary" id="generate-btn" type="button">
          Запустить генератор
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
        <p class="gen-genre" id="genre-out">Жанр появится здесь</p>
      </div>
      <div class="gen-row">
        <div class="gen-left" id="gen-left">
          <p class="gen-left-placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
            Обложка плейлиста
          </p>
        </div>
        <div class="gen-right" id="gen-right">
          <div class="gen-playlist" data-slot="0"></div>
          <div class="gen-playlist" data-slot="1"></div>
          <div class="gen-playlist" data-slot="2"></div>
          <div class="gen-playlist" data-slot="3"></div>
          <div class="gen-playlist" data-slot="4"></div>
          <div class="gen-playlist" data-slot="5"></div>
        </div>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
  <script src="generator.js"></script>
</body>
</html>
